plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'com.tencent.tpns.plugin'
version = '1.3.8'

android {
    namespace = 'com.tencent.tpns.plugin'
    compileSdk = 36

    sourceSets {
        // 官方插件将 Java 与 Kotlin 源码统一放在 src/main/kotlin。
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 23
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        disable += 'InvalidPackage'
    }
}

kotlin {
    compilerOptions {
        // 与宿主 Flutter/AGP 9 工程统一，避免 Java 17 / Kotlin 21 target 冲突。
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // 保持腾讯官方 Flutter V1.3.8 对应的 TPNS Android SDK 版本。
    implementation 'com.tencent.tpns:tpns:1.4.4.6-release'
}
